# GENERATED by contract/gen.py -- DO NOT EDIT. Edit contract/telemetry.py.
#
# Buffers a reduced snapshot to flash WHILE NOBODY IS LISTENING, so an outage
# leaves history rather than a hole.
#
# ONLY WHILE DISCONNECTED. Writing continuously would burn the ring on data
# nobody ever lost, and flash endurance is a budget worth spending on the case
# it exists for.
#
# 60 s, not the 10 s poll rate. The destination is hourly statistics, which
# cannot represent finer detail anyway, and 60 s turns a 192 KB ring into
# ninety hours of cover instead of fifteen.
#
# SLOTS (raw uint16, 0xFFFF = no reading):
#    0  battery_voltage        from battery_voltage          x100
#    1  engine_speed           from engine_speed             x1
#    2  output_voltage_l1n     from generator_l1_voltage     x10
#    3  load_l1_current        from generator_l1_current     x10
#    4  load_power             from total_power              x10
#    5  load_apparent_power    from total_apparent_power     x10
#    6  grid_voltage           from utility_l1_l2_voltage    x10
#    7  generator_frequency    from generator_l1_frequency   x100
#    8  oil_pressure           from oil_pressure_bar         x100
#    9  coolant_temperature    from coolant_temperature      x10
#   10  fuel_level             from fuel_level               x10
#   11  percentage_load        from percentage_load          x10

interval:
  - interval: 60s
    then:
      - if:
          condition:
            lambda: |-
              return id(event_log)->ready() && id(bus_healthy).state &&
                     (api::global_api_server == nullptr ||
                      !api::global_api_server->is_connected());
          then:
            - lambda: |-
                // GENERATED by contract/gen.py -- do not edit here.
                uint16_t v[12];
                { float x = id(battery_voltage).state;
                  v[0] = std::isnan(x) ? 0xFFFF : (uint16_t) std::min(65534.0f, std::max(0.0f, x * 100.0f)); }   // battery_voltage
                { float x = id(engine_speed).state;
                  v[1] = std::isnan(x) ? 0xFFFF : (uint16_t) std::min(65534.0f, std::max(0.0f, x * 1.0f)); }   // engine_speed
                { float x = id(generator_l1_voltage).state;
                  v[2] = std::isnan(x) ? 0xFFFF : (uint16_t) std::min(65534.0f, std::max(0.0f, x * 10.0f)); }   // output_voltage_l1n
                { float x = id(generator_l1_current).state;
                  v[3] = std::isnan(x) ? 0xFFFF : (uint16_t) std::min(65534.0f, std::max(0.0f, x * 10.0f)); }   // load_l1_current
                { float x = id(total_power).state;
                  v[4] = std::isnan(x) ? 0xFFFF : (uint16_t) std::min(65534.0f, std::max(0.0f, x * 10.0f)); }   // load_power
                { float x = id(total_apparent_power).state;
                  v[5] = std::isnan(x) ? 0xFFFF : (uint16_t) std::min(65534.0f, std::max(0.0f, x * 10.0f)); }   // load_apparent_power
                { float x = id(utility_l1_l2_voltage).state;
                  v[6] = std::isnan(x) ? 0xFFFF : (uint16_t) std::min(65534.0f, std::max(0.0f, x * 10.0f)); }   // grid_voltage
                { float x = id(generator_l1_frequency).state;
                  v[7] = std::isnan(x) ? 0xFFFF : (uint16_t) std::min(65534.0f, std::max(0.0f, x * 100.0f)); }   // generator_frequency
                { float x = id(oil_pressure_bar).state;
                  v[8] = std::isnan(x) ? 0xFFFF : (uint16_t) std::min(65534.0f, std::max(0.0f, x * 100.0f)); }   // oil_pressure
                { float x = id(coolant_temperature).state;
                  v[9] = std::isnan(x) ? 0xFFFF : (uint16_t) std::min(65534.0f, std::max(0.0f, x * 10.0f)); }   // coolant_temperature
                { float x = id(fuel_level).state;
                  v[10] = std::isnan(x) ? 0xFFFF : (uint16_t) std::min(65534.0f, std::max(0.0f, x * 10.0f)); }   // fuel_level
                { float x = id(percentage_load).state;
                  v[11] = std::isnan(x) ? 0xFFFF : (uint16_t) std::min(65534.0f, std::max(0.0f, x * 10.0f)); }   // percentage_load
                id(event_log)->record_sample(v);

text_sensor:
  - platform: template
    name: "Snapshot Batch"
    id: snapshot_batch
    icon: mdi:tray-arrow-down
    entity_category: diagnostic
    update_interval: never
    lambda: 'return id(event_log)->sample_batch(6);'

sensor:
  - platform: template
    name: "Snapshot Pending"
    id: snapshot_pending
    icon: mdi:counter
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 30s
    lambda: 'return id(event_log)->ready() ? (float) id(event_log)->sample_pending() : NAN;'

api:
  actions:
    - action: snapshot_ack
      variables:
        seq: int
      then:
        - lambda: 'id(event_log)->ack_sample((uint32_t) seq);'
        - component.update: snapshot_batch
        - component.update: snapshot_pending
    - action: snapshot_replay_all
      then:
        - lambda: 'id(event_log)->reset_sample_cursor();'
        - component.update: snapshot_batch

    # TEST ONLY. Writes synthetic records so the whole chain -- flash, drain,
    # Home Assistant statistics -- can be exercised without a generator and
    # without waiting for a real fault. Reachable only over the authenticated
    # API; it cannot be triggered from the web UI or by the device itself.
    - action: backlog_inject_test
      variables:
        count: int
        alarm_index: int
      then:
        - lambda: |-
            uint16_t v[12];
            for (int n = 0; n < count; n++) {
              id(event_log)->record(n % 2 ? backlog::EVENT_ALARM_CLEAR
                                          : backlog::EVENT_ALARM_SET,
                                    (uint8_t) alarm_index);
              for (int i = 0; i < 12; i++)
                v[i] = (uint16_t) (1000 + n * 10 + i);
              id(event_log)->record_sample(v);
            }
            ESP_LOGW("backlog", "TEST: injected %d synthetic event+sample pairs", count);
