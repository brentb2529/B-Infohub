# Every remaining register the controller answers, exposed raw.
#
# A full sweep of 0x0000-0x02FF on 2026-08-31 (tools/gc1032_probe.py sweep) found
# EXACTLY 87 responding registers, all within 0x0000-0x0056. Nothing above 0x0056
# answers at all -- the alt_input_registers block in genmon's map that reaches to
# 0x00C1 does not exist on this unit. 0x00B5 is the only documented register that
# does not respond, exactly as genmon warns.
#
# The other packages cover every register genmon names. This file covers the
# remainder, so that every address the controller will answer has an entity:
#
#   0x002D-0x0032, 0x0037, 0x003E-0x003F   respond, currently return 0xFFFF
#
# (0x0028 / 0x002A / 0x002C also showed up in the sweep as "unmapped" but are not
# missing -- they are the low words of the 32-bit energy counters at 0x0027 / 0x0029 /
# 0x002B, already consumed as U_DWORD in gc1032-power.yaml.)
#
# NO SENTINEL FILTER HERE, DELIBERATELY. Everywhere else 0xFFFF is translated to
# "unavailable" because it means the sensor is absent. These entities exist precisely
# so you can watch for 0xFFFF turning into something else, so they publish the raw
# word. 65535 here means "still nothing"; any other value is a discovery.
#
# All disabled_by_default: they are research instruments, not telemetry. Enable in
# Home Assistant when you want to hunt, and re-run the sweep during an exercise cycle
# -- registers that are dead at rest are exactly the ones that may populate while the
# engine is turning.

# ALL NINE REMOVED -- they cost RAM and have never carried data.
#
# The sweep found these nine answering, and every one has returned 0xFFFF
# ("sensor not present") every time it has ever been read -- including through a
# complete crank-run-cooldown cycle on 2026-09-18, which is exactly the
# condition the note above said might populate them. They did not.
#
# They came out because the bridge ran out of heap. Adding the controller-clock
# watchdog pushed a build to abort on boot inside the API send buffer --
# operator new[] failing -- and the bootloader rolled it back. On a board at 82%
# static RAM, nine entities that have never produced a value are not a free
# research instrument; they are the reason a real health check would not fit.
#
# Nothing is lost for hunting: tools/gc1032_probe.py sweeps these addresses
# without needing entities for them, which is the better tool for it anyway.
# Restoring them is one `git revert`.
