# Every remaining register the controller answers, exposed raw.
#
# A full sweep of 0x0000-0x02FF on 2026-08-31 (tools/gc1032_probe.py sweep) found
# EXACTLY 87 responding registers, all within 0x0000-0x0056. Nothing above 0x0056
# answers at all -- the alt_input_registers block in genmon's map that reaches to
# 0x00C1 does not exist on this unit. 0x00B5 is the only documented register that
# does not respond, exactly as genmon warns.
#
# The other packages cover every register genmon names. This file covers the
# remainder, so that every address the controller will answer has an entity:
#
#   0x002D-0x0032, 0x0037, 0x003E-0x003F   respond, currently return 0xFFFF
#
# (0x0028 / 0x002A / 0x002C also showed up in the sweep as "unmapped" but are not
# missing -- they are the low words of the 32-bit energy counters at 0x0027 / 0x0029 /
# 0x002B, already consumed as U_DWORD in gc1032-power.yaml.)
#
# NO SENTINEL FILTER HERE, DELIBERATELY. Everywhere else 0xFFFF is translated to
# "unavailable" because it means the sensor is absent. These entities exist precisely
# so you can watch for 0xFFFF turning into something else, so they publish the raw
# word. 65535 here means "still nothing"; any other value is a discovery.
#
# All disabled_by_default: they are research instruments, not telemetry. Enable in
# Home Assistant when you want to hunt, and re-run the sweep during an exercise cycle
# -- registers that are dead at rest are exactly the ones that may populate while the
# engine is turning.

sensor:
  - platform: modbus_controller
    modbus_controller_id: gc1032
    name: "Raw 0x002D"
    id: raw_0x002d
    address: 0x002D
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true

  - {platform: modbus_controller, modbus_controller_id: gc1032, name: "Raw 0x002E", id: raw_002e, address: 0x002E, register_type: read, value_type: U_WORD, accuracy_decimals: 0, entity_category: diagnostic, disabled_by_default: true}
  - {platform: modbus_controller, modbus_controller_id: gc1032, name: "Raw 0x002F", id: raw_002f, address: 0x002F, register_type: read, value_type: U_WORD, accuracy_decimals: 0, entity_category: diagnostic, disabled_by_default: true}
  - {platform: modbus_controller, modbus_controller_id: gc1032, name: "Raw 0x0030", id: raw_0030, address: 0x0030, register_type: read, value_type: U_WORD, accuracy_decimals: 0, entity_category: diagnostic, disabled_by_default: true}
  - {platform: modbus_controller, modbus_controller_id: gc1032, name: "Raw 0x0031", id: raw_0031, address: 0x0031, register_type: read, value_type: U_WORD, accuracy_decimals: 0, entity_category: diagnostic, disabled_by_default: true}
  - {platform: modbus_controller, modbus_controller_id: gc1032, name: "Raw 0x0032", id: raw_0032, address: 0x0032, register_type: read, value_type: U_WORD, accuracy_decimals: 0, entity_category: diagnostic, disabled_by_default: true}
  - {platform: modbus_controller, modbus_controller_id: gc1032, name: "Raw 0x0037", id: raw_0037, address: 0x0037, register_type: read, value_type: U_WORD, accuracy_decimals: 0, entity_category: diagnostic, disabled_by_default: true}
  - {platform: modbus_controller, modbus_controller_id: gc1032, name: "Raw 0x003E", id: raw_003e, address: 0x003E, register_type: read, value_type: U_WORD, accuracy_decimals: 0, entity_category: diagnostic, disabled_by_default: true}
  - {platform: modbus_controller, modbus_controller_id: gc1032, name: "Raw 0x003F", id: raw_003f, address: 0x003F, register_type: read, value_type: U_WORD, accuracy_decimals: 0, entity_category: diagnostic, disabled_by_default: true}
