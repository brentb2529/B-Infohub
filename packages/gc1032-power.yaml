# GC-1032 electrical measurements — input registers 0x0000-0x002C (FC04).
# Addresses, multipliers and lengths from vendor/Briggs_Stratton_GC-1032.json.
#
# NOTE ON PHASES: a residential split-phase 240 V unit populates L1 and L2 only.
# The L3 entities are polled (they sit inside the contiguous read block, so skipping
# them would not save a single bus transaction) but are disabled_by_default so they
# do not clutter Home Assistant. Enable them if this is ever a 3-phase set.

# ---------------------------------------------------------------------------
# Exact 32-bit capture for the three cumulative counters.
#
# An ESPHome sensor state is a float32: 24 bits of mantissa. These registers
# are 32-bit counters, so above ~16.7 million the state CANNOT hold the value
# exactly -- a round trip through the sensor loses the low bits. That is
# harmless for a dashboard (the error is about 1 part in 16 million) but it is
# not harmless for packages/passthrough.yaml, which has to hand the InfoHub the
# same number the controller gave us. Measured: 98% of 32-bit values come back
# altered.
#
# So the raw word is captured here, from the response bytes, before any float
# is involved. The lambda returns x unchanged, so the sensor behaves exactly as
# it did; the globals exist purely for the proxy.
# ---------------------------------------------------------------------------
globals:
  - id: raw_dword_0027
    type: uint32_t
    restore_value: false
    initial_value: '0xFFFFFFFF'
  - id: raw_dword_0029
    type: uint32_t
    restore_value: false
    initial_value: '0xFFFFFFFF'
  - id: raw_dword_002b
    type: uint32_t
    restore_value: false
    initial_value: '0xFFFFFFFF'


