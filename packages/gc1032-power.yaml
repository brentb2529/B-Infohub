      return x;
    address: 0x002B            # spans 0x002B-0x002C
    register_type: read
    value_type: U_DWORD
    unit_of_measurement: kvarh
    state_class: total_increasing
    accuracy_decimals: 1
    disabled_by_default: true
    filters:
      - lambda: 'return x >= 4294967295.0f ? NAN : x;'  # sentinel = not present
      - multiply: 0.1

  # >>> 0x002D-0x0032 IS A HOLE. Do not poll it. See docs/register-map.md.
