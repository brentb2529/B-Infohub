  - platform: modbus_controller
    modbus_controller_id: gc1032
    name: "Protocol Revision"
    id: protocol_revision
    address: 0x0000
    register_type: read
    value_type: U_WORD
    entity_category: diagnostic
    force_new_range: true

  # --- Generator output voltage --------------------------------------------
    filters:
      - lambda: 'return x >= 65535.0f ? NAN : x;'   # 0xFFFF = sensor not present

  - platform: modbus_controller
