  # --- Cumulative energy (32-bit, two registers each) -----------------------
  - platform: modbus_controller
    modbus_controller_id: gc1032
    name: "Cumulative Energy"
    id: cumulative_energy
    # Capture the exact 32-bit word for the InfoHub proxy; see the note above.
    lambda: |-
      if (data.size() >= 4)
        id(raw_dword_0027) = ((uint32_t) data[0] << 24) | ((uint32_t) data[1] << 16) |
                               ((uint32_t) data[2] << 8)  |  (uint32_t) data[3];
      return x;
    address: 0x0027            # spans 0x0027-0x0028
    register_type: read
    value_type: U_DWORD
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - lambda: 'return x >= 4294967295.0f ? NAN : x;'  # sentinel = not present
      - multiply: 0.1

  - platform: modbus_controller
